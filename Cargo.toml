[package]
name = "excel_to_xml"
version = "0.1.8"
edition = "2021"

[lib]
name = "excel_to_xml"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Excel读取
calamine = "0.32.0"
# JSON解析
# serde = "1.0.215"
serde_json = "1.0.151"
# xml读写
quick-xml = "0.38.4"
# 正则表达式
regex = "1.13.1"
# 日志门面
log = "0.4.34"

[dev-dependencies]
zip = { version = "8.6.0", default-features = false }
